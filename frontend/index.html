<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Vibe — Find your next read by mood</title>
    <meta name="description" content="AI-powered book recommendations. Type a mood or feeling and discover books that match." />

    <!-- Preconnect to Google Fonts for faster load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display: elegant serif for headings (book-like feel)   -->
    <!-- Inter: clean modern sans-serif for body text (max readability)  -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Favicon — inline SVG book emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
  </head>
  <body>
    <!-- React mounts the entire app inside this div -->
    <div id="root"></div>
    <!-- Vite injects the bundled JS here at build time -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
